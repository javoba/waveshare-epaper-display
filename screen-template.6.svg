  <text x="20" y="80" style="font-size:80px;font-family:sans-serif;" id="dayname">DAY_NAME</text>
  <text x="20" y="170" style="font-size:66px;font-family:sans-serif;" id="daydate">DAY_ONE</text>

  <!-- Weather icon + temps (right side) -->
  <g transform="translate(600,10) scale(1)" id="weathericon">
    <use href="icons/ICON_ONE.svg" />
  </g>
  <text x="600" y="150" style="font-size:32px;font-family:sans-serif;" id="temps">HIGH_ONE / LOW_ONE</text>




  <rect x="15" y="200" width="154" height="270" fill="#EEE" stroke="none"/>

  <!-- Weekly grid box -->
  <!-- Grid dimensions -->
  <rect x="15" y="200" width="770" height="270" fill="none" stroke="#000" stroke-width="2"/>

  <g id="week-grid-lines" stroke="#000" stroke-width="1">
    <line x1="169" y1="200" x2="169" y2="470"/>
    <line x1="323" y1="200" x2="323" y2="470"/>
    <line x1="477" y1="200" x2="477" y2="470"/>
    <line x1="631" y1="200" x2="631" y2="470"/>
    <line x1="786" y1="200" x2="786" y2="470"/>
  </g>


