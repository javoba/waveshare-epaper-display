<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="480" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="480" fill="white"/>

  <!-- Top bar -->
  <text x="30" y="55" style="font-size:48px;font-family:sans-serif;" id="dayname">DAY_NAME</text>
  <text x="30" y="100" style="font-size:30px;font-family:sans-serif;" id="daydate">DAY_ONE</text>

  <!-- Weather icon + temps (right side) -->
  <g transform="translate(600,10) scale(1)" id="weathericon">
    <use href="icons/ICON_ONE.svg" />
  </g>
  <text x="600" y="150" style="font-size:32px;font-family:sans-serif;" id="temps">HIGH_ONE / LOW_ONE</text>




  <rect x="15" y="200" width="110" height="270" fill="#EEE" stroke="none"/>

  <!-- Weekly grid box -->
  <!-- Grid dimensions -->
  <rect x="15" y="200" width="770" height="270" fill="none" stroke="#000" stroke-width="2"/>

