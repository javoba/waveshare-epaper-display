  <defs>
    <!-- One clip rect per column (x, y, width, height) -->
    <clipPath id="clip-col0"><rect x="15"  y="200" width="154" height="270"/></clipPath>
    <clipPath id="clip-col1"><rect x="169" y="200" width="154" height="270"/></clipPath>
    <clipPath id="clip-col2"><rect x="323" y="200" width="154" height="270"/></clipPath>
